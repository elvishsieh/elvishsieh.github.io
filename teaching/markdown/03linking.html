<section data-markdown><script type="text/template">
## 超連結(1/2)
| Markdown 語法 | HTML 語法 | 顯示的效果 |
| :--- | :--- | :--- |
| `[Google](https://google.com)` | `<a href="https://google.com">Google</a>` | [Google](https://google.com) |
| `<user@example.com>` 或 `[寄信給我](mailto:user@example.com)` | `<a href="mailto:user@example.com">寄信給我</a>` | <user@example.com> 或 [寄信給我](mailto:user@example.com) |
| `[關於我們](/about.html)` | `<a href="/about.html">關於我們</a>` | 關於我們 (連至同網站根目錄下的網頁) |
| `[下一頁](page2.html)` | `<a href="page2.html">下一頁</a>` | 下一頁 (連至同資料夾下的網頁) |
| `[讀取圖片](../images/logo.png)` | `<a href="../images/logo.png">讀取圖片</a>` | 讀取圖片 (連至上一層資料夾的圖片) |
||||
</script></section>
<section data-markdown><script type="text/template">
## 超連結(2/2)
| Markdown  | HTML  | 顯示的效果 |
| :--- | :--- | :--- |
| `- [第1章](#第1章)`<br>`- [第2章](#第2章)` |  | **TOC 目錄**<br> [第1章](#第1章)<br> [第2章](#第2章) |
| `[跳到第1章](#第1章)` | `<a href="#第1章">跳到第1章</a>` | [前往目標](#target-id) *(點擊跳轉至指定 ID 位置)* |
| `# 標題文本` 或 `<div id="target-id">內容</div>` | `<h1 id="標題文本">標題文本</h1>` 或 `<div id="target-id">內容</div>` | 建立一個可供跳轉的**錨點（ID）** |
| `[我的最愛][1]`<br> | `<a href="https://google.com" title="Google">我的最愛</a>` | [我的最愛][1] *(參考文獻樣式：文內簡潔，網址統一寫在文末)* <br> |
|||
<p>[1]: https://google.com "Google"</p>
</script></section>
