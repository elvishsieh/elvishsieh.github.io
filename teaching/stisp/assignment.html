<section data-markdown><script type="text/template">
# 專題與期中、期末報告
</script>
</section>
<section data-markdown><script type="text/template">
## 專題製作與報告
- 專題製作團隊
	- **下週上課前**完成組隊，填寫[報告順序及分組名單](https://docs.google.com/spreadsheets/d/1oP6ev7tQE2koYaH6rcENPDZyEwwEwDWRK8rrYlOoK5s/edit?gid=0#gid=0)
	- 包含**隊名、專案名稱、隊長及隊員的姓名**
- 組隊原則與限制
	- 每一隊自由組隊，人數儘可能以 1-3 人為一組
	- **不要超過 4 人**
- 成果報告
	- 期中、期末簡報
	- 期中、期末書面報告
</script>
</section>
<section data-markdown><script type="text/template">
# 期中報告
</script>
</section>
<section data-markdown><script type="text/template">
## 期中報告(1/2)
- 簡報檔(Slides)
	- 專案報告簡報檔大約 10-15 分鐘的簡報資料，內容包含從**專案題目選定、專案責任分工、Web Framework 選定、專案資料收集、分析等**
	- 報告可以展示專案團隊**目前資料收集與開發的進度、未來開發的進度與規劃**
- 書面報告
	- 書面報告格式不拘，可以下載[書面報告範例](https://docs.google.com/document/d/1AhDOds0p0FkJ4HAhlsb2ZtKAw8RwucGc/edit?usp=sharing&ouid=111001745275170216675&rtpof=true&sd=true)參考
	- ~~書面報告可以加入專案開發過程的各種說明文件，包含系統分析、使用手冊、程式說明文件及系統測試文件等~~
</script></section>
<section data-markdown><script type="text/template">
## 期中報告(2/2)
- 繳交方式
	- 繳交期中報告的簡報檔及期中書面報告
	- 期中報告的簡報檔及期中書面報告，請上傳到 [mid-term](https://drive.google.com/drive/folders/1oz1sdl7uCLj3rXh_zba-9LVlajFFPgKp?usp=sharing) 連結的網址
	- 上傳檔名格式：**0X-隊名-專案名稱**
- 簡報當日注意事項(2026.11.18)
	- 簡報檔請每一組在**報告前先自行複製一份檔案到前面的教師用的電腦內**，減短報告的時間
</script></section>
</section><!--end block-->

<section><!--start block-->
<section data-markdown><script type="text/template">
# 期末報告
</script>
</section>
<section data-markdown><script type="text/template">
## 期末報告(1/2)
- 簡報檔(Slides)
	- 專案報告簡報檔大約 10-15 分鐘的簡報資料，內容包含整學期從專案題目選定、專案責任分工、專案資料收集、分析、開發過程
	- 報告可以展示專案團隊**目前開發完成的成果，並說明尚未完成的進度與未來工作(future work)**
- 書面報告
	- 書面報告格式不拘，可以下載[書面報告範例](https://docs.google.com/document/d/1AhDOds0p0FkJ4HAhlsb2ZtKAw8RwucGc/edit?usp=sharing&ouid=111001745275170216675&rtpof=true&sd=true)參考
	- 書面報告可以加入專案開發過程的各種說明文件，包含**系統分析、使用手冊、程式說明文件及系統測試文件等**
</script></section>
<section data-markdown><script type="text/template">
## 期末報告(2/2)
- 繳交方式
	- 繳交期末報告的簡報檔及期末書面報告
	- 期末報告的簡報檔及期末書面報告，請上傳到 [Final](https://drive.google.com/drive/folders/1EqZggehawIpCjL2T6I9Mj7zv5moGyWNc?usp=sharing) 連結的網址
	- 上傳檔名格式：**0X-隊名-專案名稱**
- 簡報當日注意事項(2027.01.10)
	- 簡報檔請每一組在**報告前先自行複製一份檔案到前面的教師用的電腦內**，減短報告的時間
</script></section>
</section><!--end block-->

</div>

<script>
Reveal.initialize({
controls: true,
progress: true,
history: true,
center: true,
slideNumber: true,
mouseWheel: true,
transition: 'slide', // none/fade/slide/convex/concave/zoom

menu: {
	side: 'left',
	width: 'normal',
	numbers: false,
	titleSelector: 'h1, h2, h3, h4, h5, h6',
	useTextContentForMissingTitles: false,
	hideMissingTitles: false,
	markers: true,
	custom: true,
	themes: true,
	themesPath: '/revealjs/dist/theme/',
	transitions: true,
	openButton: true,
	openSlideNumber: false,
	keyboard: true,
	sticky: false,
	autoOpen: true,
	delayInit: false,
	openOnInit: false,
	loadIcons: true,
	
	custom: [
			{ title: 'TOC', icon: '<i class="fa fa-external-link-alt">', src: 'links.html' },
			{ title: 'About', icon: '<i class="fa fa-info">', content: '<p>Slides for teaching Office Suite Softwar</p>' }
	]
},

customcontrols: {
	controls: [
	{
		id: 'toggle-overview',
		title: 'Toggle overview (O)',
		icon: '<i class="fa fa-th"></i>',
		action: 'Reveal.toggleOverview();'
	},
	{ icon: '<i class="fa fa-pen-square"></i>',
		title: 'Toggle chalkboard (B)',
		action: 'RevealChalkboard.toggleChalkboard();'
	},
	{ icon: '<i class="fa fa-pen"></i>',
		title: 'Toggle notes canvas (C)',
		action: 'RevealChalkboard.toggleNotesCanvas();'
	}
	]
},

toolbar: {
	// Specifies where the toolbar will be shown: 'top' or 'bottom'
	position: 'bottom',

	// Add button to toggle fullscreen mode for the presentation
	fullscreen: true,

	// Add button to toggle the overview mode on and off
	overview: true,

	// Add button to pause (hide) the presentation display
	pause: true,

	// Add button to show the speaker notes
	notes: false,

	// Add button to show the help overlay
	help: false,

	// If true, the reveal.js-menu will be moved into the toolbar.
	// Set to false to leave the menu on its own.
	captureMenu: true,

	// If true, the playback control will be moved into the toolbar.
	// This is only relevant if the presentation is configured to autoSlide.
	// Set to false to leave the menu on its own.
	capturePlaybackControl: true,

	// By default the menu will load it's own font-awesome library
	// icons. If your presentation needs to load a different
	// font-awesome library the 'loadIcons' option can be set to false
	// and the menu will not attempt to load the font-awesome library.
	loadIcons: true
},

// Optional reveal.js plugins
plugins: [ RevealZoom, RevealNotes, RevealSearch, RevealMarkdown, RevealHighlight, RevealAnimate, RevealMenu, RevealCustomControls, RevealChalkboard ],

dependencies: [
//{ src: '/revealjs/plugin/toolbar/toolbar.js' }
]
});

</script>
