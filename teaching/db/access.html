<section data-markdown><script type="text/template">
## Access 6個主要的物件(1/2)
<li class="fragment"><b>資料表(table)：</b>定義資料結構以及存放資料的地方，資料表是由各種不同型態的欄位所構成，<b>每一列資料稱為一筆紀錄(Record)，而每筆紀錄則包含一個以上的欄位(field)</b>
<li class="fragment"><b>查詢(Query)：</b>擷取所需的資訊，且可將查詢結果儲存。查詢有兩種主要的類型，即「選取查詢」與「動作查詢」
		<li class="fragment"><b>選取查詢：</b>依照查詢規則擷取資料表中的紀錄，並顯示在螢幕上
	<li class="fragment"><b>動作查詢：</b>會將資料表的內容加以更新、刪除、複製或合併，它會修改資料表的內容
	<li class="fragment">建置好資料庫以後，大部分都是使用查詢(query)的功能
	</script></section>
<section data-markdown><script type="text/template">
## Access 6個主要的物件(2/2)
<li class="fragment"><b>表單(Form)：</b>主要用來登錄資料表的一種介面，它能讓資料表中的欄位集中在一個畫面上，以方便輸入資料
<li class="fragment"><b>報表(Report)：</b>將結果印成報表
<li class="fragment">模組(Module)：模組是利用 VBA(Visual Basic for Applications)程式語言所撰寫的程式所成的集合
<li class="fragment">巨集(Macro)：巨集執行的功能
</script></section>

<section data-markdown><script type="text/template">
## 表單(Form)
- 同學心中所認為的<b>表單(Form)</b>是什麼？
<li class="fragment">在我們的日常生活中曾經接觸過許多表單，表單就是<b>依照某些特定的需求，要求使用者填寫資料的單子(紙張)。</b>
<li class="fragment"><b>資料表(Table)可以讓一般的使用者任意修改嗎？</b>
<li class="fragment">如果上一個問題的答案是：<b>可以</b>，對資料庫有什麼影響？
<li class="fragment">資料表(Table)建立完成後，<b>資料輸入、維護的工作是由誰來負責？</b>DBA 嗎？還是前端的使用者？<a href="01intro.html#/4">System Diagram</a>
<li class="fragment">表單(Form)：是設計給前端使用者操作資料庫，讓使用者可以輸入/維護資料表(Table)的資料，<b>但不會影響到資料表中的欄位、資料型態、欄位大小等重要的資料。</b>
<li class="fragment">表單(Form)<b>可以用來輸入資料及查詢或修改資料的地方</b>
</script></section>
<section data-markdown><script type="text/template">
## 建立表單(Form)的步驟
- 開啟資料庫(database) >>「建立」命令索引標籤 >>「表單」群組 >>「其他表單」>>「表單精靈」
- 選擇「>>」，將所有欄位加入
- 選擇表單的配置方式：有單欄式、表格式、資料工作表、對齊
- 選擇樣式：自行選擇
- 輸入表單的標題名稱，然後按下「完成」按鈕
</script></section>
<section data-markdown><script type="text/template">
## 什麼是切換表單？
- 切換表單<b>是階層式的目錄選單</b>，讓使用者可以依照選單的項目，選擇所需要的功能項目來維護資料表中的資料。
![](/images/db/chMenu.png)
</script></section>

<section data-markdown><script type="text/template">
## 報表的定義及資料來源
- 報表(Report)是把資料庫的資料<b>經過各種運算以後</b>，將出其結果以報告或表列方式呈現的一種資料型態

- 報表(Report)/表單(Form)的資料來源
- <b>資料表(Table)</b>
- <b>表單(Form)</b>
- <b>查詢(Query)</b>
</script></section>

<section data-markdown><script type="text/template">
## Access 報表的操作步驟
- <b>開啟資料表(table)</b>，點選「建立」命令索引標籤
- <b>在「報表」群組中，點選「報表精靈」</b>，跳出「報表精靈」對話框
- <b>選取製作報表所需的「欄位名稱」</b>，然後按下一步
- 決定是否要增加「群組層次」 ，然後按下一步
- 決定「排序」的方式 ，然後按下一步
- 選擇「版面的配置」及「列印的方向」 ，然後按下一步
- 選擇「樣式」 ，然後按下一步
- 按下「完成」即可預覽報表的結果
</script></section>

<section data-markdown><script type="text/template">
## Access 查詢(Query)的種類
- <b>選取查詢</b>：依照你設定的「查詢準則」來查詢資料庫中的資料，此種查詢方式<b>不會更動資料表的內容</b>
- <b>動作查詢</b>：可分為「製成資料表」、「新增」、「更新」、「刪除」，此種查詢方式<b>會更動資料表的內容</b>
- <b>參數查詢</b>：準則查詢有異動時，必須更新設定準則的內容，沒有效率；<b>參數查詢是在執行查詢時，會跳出對話框，要求輸入查詢的準則內容來查詢</b>
</script></section>
<section data-markdown><script type="text/template">
## 函數(function)
- <b>函數</b>的構成包括<b>指令(instruction)和引數(argument)</b>，例如：sum([學費])
- <b>指令的英文字母沒有大小寫之分</b>，sum(),Sum(),SUM()都是同一個指令
- 有些指令不需要引數，有些指令的引數則不只有一個
- Access 2007 提供了<b>17大類的函數</b>，各個函數的用法，請參考  access 的說明文件(help)
- <b>查詢函數的用法：在 access 中按F1鍵</b>，會出現說明文件的查詢視窗，在輸入「函數」就可以到所有的函數的用法
</script></section>

<section data-markdown><script type="text/template">
## 交叉資料表查詢(1/2)
- 「交叉資料表查詢」<b>是一種選取查詢</b>，可用於將摘要資料 (總和、平均、計數及類似的函數)排列成兩個類別配置

<section data-markdown><script type="text/template">
## 參考完整性限制
- 參考完整性限制的目的是<b>確保關聯資料表中紀錄的正確性</b>，讓使用者不能隨便刪除或變更相關的紀錄
- 完整性限制條件：
- 鍵值(Key)限制條件：關聯資料表一定<b>擁有唯一和最小的主鍵(Primary Key)</b>
- 定義域限制條件：關聯資料表一定是<b>屬於定義域的值</b>
- 實體完整性：關聯資料表的主鍵(Primary Key)不可以是空值(not Null)
- 參考完整性：當關聯資料表存在外來鍵時，<b>外來鍵的值一定是來自參考資料表的主鍵值或空值</b>，此為關聯資料表之間的完整性條件，即關聯資料表<b>不可包含無法對應的外來鍵</b>
</script></section>

- 按住 Ctrl，選取欲關聯的兩個或多個資料表，並拖曳到右邊的「資料關聯圖」中
- 點選第一個資料表的欄位，然後拖曳到另一個資料表的欄位，放開滑鼠之後，會出現「編輯關聯」的對話框

- 按一下「建立」按鈕
</script></section>
<section data-markdown><script type="text/template">
## 「強迫參考完整性」的說明
- 在上一張投影片的步驟5中，勾選「強迫參考完整性」的作用，是為了<b>保持資料表之間資料的一致性</b>
- 所謂<b>父資料表就是在一對多關聯中「1」的資料表，子資料表就是「多」的那一個資料表</b>
- 如果在父資料表中，刪除或更動key 值欄位的任何一筆紀錄(record)，則子資料表中的某些紀錄將失去連結
- 如果在子資料表中，新增一筆紀錄，而此筆記錄在父資料表中沒有相對的紀錄，則這筆紀錄也不具有連結的功能
</script></section>

<section data-markdown><script type="text/template">
## 關聯圖的連接方式(2/2)
- 僅包含兩個資料表連接欄位的資料相同的紀錄：<b>此種連接方式稱為 inner join(內部連結)，只顯示兩個資料表中資料相同的紀錄</b>
- 包含所有來自’left table_name’的紀錄和只包含那些連接欄位相等的’right table_name’欄位：<b>稱為 left join，以 left table 為主</b>，顯示 left table 的所有紀錄，和 right table 中與 left table 相關的紀錄
- 包含所有來自’right table_name’的紀錄和只包含那些連接欄位相等的’left table_name’欄位：<b>稱為 right join，以 right table 為主</b>，顯示 right table 的所有紀錄，和 left table 中與 right table 相關的紀錄
</script></section>
