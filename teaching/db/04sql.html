# What is SQL?
</script></section>
<section data-markdown><script type="text/template">
## SQL Background(背景)
- IBM developed the original version of SQL, originally called Sequel, as part of the System R project in the early 1970.
- Sequel language name has changed to SQL(Structured Query Language).
- In 1986, ANSI(American National Standards Institute) and ISO(the International Organization for Standardization) published an SQL.
- Version: SQL-89 in 1989, SQL-92, SQL-2003
</script></section>
<section data-markdown><script type="text/template">
## Example of SQL(1/2)
- 在資料庫建立一個資料表，資料表名稱命名為 Customers
<pre><code data-trim data-line-numbers>CREATE TABLE Customers(
	CustomerID INTEGER PRIMARY KEY NOT NULL,
	Customers_Name	VARchar(50),
	City	varchar(50),
	Adderess varchar(100)
);
</code></pre>
- 從 Customers 資料表中找出客戶 jenny 的城市名稱及地址
<pre><code data-trim data-line-numbers>SELECT Customer_Name, City, Address
FROM customers
WHERE  Customer_Name=‘jenny’;</code></pre>
</script></section>
<section data-markdown><script type="text/template">
## Example of SQL(2/2)
- 請同學使用 HeidiSQL 建立一個 Customers 資料表，插入多筆資料，並查詢某一位客戶的地址
<pre><code>CREATE TABLE Customers(
	CustomerID INTEGER PRIMARY KEY NOT NULL,
	Cname	VARCHAR(50),
	City	VARCHAR(50),
	Adderess VARCHAR(100)
);
INSERT INTO Customers
VALUES
(NULL,'布尚雪', '台中市', '三民路三段129號'),
(NULL,'柯吉霸', '高雄市', '中山路三段129號'),
(NULL,'賴吉賽', '台北市', '重慶南路三段129號'),
(NULL,'布尙頒', '新竹市', '光復路三段129號');</code></pre>

</script></section>
<section data-markdown><script type="text/template">
## 何謂查詢(Query)
- 在中文的文字解釋中，查詢與搜尋意思相近？<br />意思是<b>找</b>資料
<li class="fragment roll-in">而英文(資料庫)的<b>查詢(Query)與搜尋(Search)不盡相同</b>
<li class="fragment roll-in"><b>查詢(Query)</b>是資料表的搜尋功能，可以在資料表中<b>找出符合條件的紀錄資料，以便進行分析或計算。</b>
<li class="fragment roll-in"><b>篩選(Filter)</b>是指在資料表中，<b>只顯示出需要的紀錄</b>，至於那些不符合條件就隱藏起來。
<li class="fragment roll-in"><b>排序(Sorting)</b>是將一串資料<b>依照特定的方式進行排列</b>，例如：遞增排序、遞減排序；資料結構中應該有介紹各種不同的排序演算法。
</script></section>

# Query in Northwind

<section data-markdown><script type="text/template">
## SQL language
<pre><code data-trim data-line-numbers>SELECT *
FROM Customers;
--- This is comment
SELECT CustomerID, ShipName, ShipAddress, ShipCity, ShipRegion
FROM Orders
WHERE ShipCity = '台中市';
--- This is comment
SELECT CustomerID, ShipName, ShipAddress, ShipCity, ShipRegion
FROM Orders
WHERE ShipCity = '台中市' AND ShipRegion = '中港';
--- This is comment
UPDATE Customers
SET Country = 'TW'
WHERE City = '台中市' AND Region = '中港區';
</code></pre>
</script></section>
