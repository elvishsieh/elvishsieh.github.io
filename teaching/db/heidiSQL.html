<section data-markdown><script type="text/template">
# HeidiSQL Installation
</script></section>
<section data-markdown><script type="text/template">
## Install HeidiSQL for SQLite(1/8)
- Download "Windows x64 Portable" version from [HeidiSQL Download Webpage](https://www.heidisql.com/download.php)
![](/images/db/heidiSQL.png)
</script></section>
<section data-markdown><script type="text/template">
## Install HeidiSQL for SQLite(2/8)
- 將下載的檔案解壓縮 ≫ 開啟 **heidisql.exe** 執行檔
![](/images/db/heidiSQL2.png)
</script></section>
<section data-markdown><script type="text/template">
## Install HeidiSQL for SQLite(3/8)
- 在 HeidiSQL 工作階段管理員按下**新增**按鈕
![](/images/db/heidiSQL3.png)
</script></section>
<section data-markdown><script type="text/template">
## Install HeidiSQL for SQLite(4/8)
- 命名要連結資料庫的名稱 ≫ 網路類型點選 **SQLite**
![](/images/db/heidiSQL4.png)
</script></section>
<section data-markdown><script type="text/template">
## Install HeidiSQL for SQLite(5/8)
-  建立一個副檔名為 .db 的資料庫檔案 ≫ 點選這個 .db 檔案 
![](/images/db/heidiSQL5.png)
</script></section>
<section data-markdown><script type="text/template">
## Install HeidiSQL for SQLite(6/8)
- 按下**開啟**按鈕，連結到儲存在硬碟內的 SQLite 資料庫
![](/images/db/heidiSQL6.png)
</script></section>
<section data-markdown><script type="text/template">
## Install HeidiSQL for SQLite(7/8)
- 按下**是**按鈕，儲存剛剛命名的連結資料庫
![](/images/db/heidiSQL7.png)
</script></section>
<section data-markdown><script type="text/template">
## Install HeidiSQL for SQLite(8/8)
- 可以在**查詢**視窗輸入 SQL 指令，新增、儲存資料庫內的資料
![](/images/db/heidiSQL8.png)
</script></section>
</section><!--end block-->

<section><!--start block-->
<section data-markdown><script type="text/template">
# Setting AutoComplete
</script></section>
<section data-markdown><script type="text/template">
## Setting AutoComplete(1/4)
- 工具 ≫ 偏好設定
![](/images/db/autoComplete.png)
</script></section>
<section data-markdown><script type="text/template">
## Setting AutoComplete(2/4)
- **快速鍵**頁籤 ≫ SQL 選項
![](/images/db/autoComplete2.png)
</script></section>
<section data-markdown><script type="text/template">
## Setting AutoComplete(3/4)
- 點選**顯示 SQL 補完建議** ≫ 右邊**快速鍵**輸入欄位按 "Ctrl + Space" 鍵
![](/images/db/autoComplete3.png)
</script></section>
<section data-markdown><script type="text/template">
## Setting AutoComplete(4/4)
- 在查詢視窗中按 **Ctrl + Space** 鍵，測試是否出現補完的建議
![](/images/db/autoComplete4.png)
</script></section>
</section><!--end block-->

<section><!--start block-->
<section data-markdown><script type="text/template">
# Connect SQL Server
</script></section>
<section data-markdown><script type="text/template">
### Connect SQL Server with HeidiSQL(1/4)
- 新增 ≫ 命名要連結資料庫的名稱(Microsoft SQL Server)
![](/images/db/connectSQL.png)
</script></section>
<section data-markdown><script type="text/template">
### Connect SQL Server with HeidiSQL(2/4)
- 選**Microsoft SQL Server(named pipe)** ≫ 主機欄位輸入 localhost ≫ 勾選**使用 Windows 認證** 
![](/images/db/connectSQL2.png)
</script></section>
<section data-markdown><script type="text/template">
### Connect SQL Server with HeidiSQL(3/4)
- 成功連結至 Microsoft SQL Server
![](/images/db/connectSQL3.png)
</script></section>
<section data-markdown><script type="text/template">
### Connect SQL Server with HeidiSQL(4/4)
- 取消勾選**使用 Windows 認證** ≫ 改以 sa 帳號、密碼連結 Microsoft SQL Server
![](/images/db/connectSQL4.png)
</script></section>
