# MS SQL Server
</script></section>
<section data-markdown><script type="text/template">
## 核心版本與選擇
- [Microsoft SQL Server](https://www.microsoft.com/zh-tw/sql-server) 是由微軟開發的關聯式資料庫管理系統(RDBMS)，主要使用 Transact-SQL (T-SQL) 語言進行資料存取與管理  
- 主要版本與授權(目前最新主要版本是 SQL Server 2025)
	- Enterprise 版：提供完整高可用性、記憶體內部(In-Memory)高效能與企業級安全性
	- Standard 版：適用於部門與中小型組織的基本資料管理
	- Developer 版：免費的完整功能版本，僅限於非生產環境(開發與測試)使用
	- Express 版：免費版本，適合小型桌面、網頁與小型伺服器應用程式
</script></section>
<section data-markdown><script type="text/template">
## 支援平台與部署
- 作業系統與容器
	- 支援 Windows、Linux 以及 Docker 容器映像檔部署
- 雲端整合
	- 支援地端(On-premises)部署，亦可部署於 Azure 虛擬機器或搭配 Azure 雲端服務(如 Azure SQL Database)
</script></section>
<section data-markdown><script type="text/template">
## 常用管理與開發工具
- **SQL Server Management Studio (SSMS)**
	- 傳統且功能完整的資料庫管理與開發圖形介面
- SQL Server Data Tools (SSDT)
	- 整合於 Visual Studio 的資料庫開發工具
- Visual Studio Code (MSSQL Extension)
	- 輕量化跨平台 SQL 擴充功能
- Power BI Report Server
	- 用於建立與發佈互動式報表的本地端報表伺服器
</script></section>
<section data-markdown><script type="text/template">
## Installation

</script></section>

## Installation
- command

mkdir D:\msSQLdb\SQLLog
mkdir D:\msSQLdb\SQLBackup
